name: Reproducible Android Build

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Tag or commit to build"
        required: true
        default: "v0.11.6-startup-tips"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Show release commit
        run: |
          echo "Building:"
          git rev-parse HEAD
          git describe --tags --always

      - name: Reject tracked build artifacts
        shell: bash
        run: |
          set -e

          if git ls-files | grep -E '(^|/)target/'; then
            echo
            echo "ERROR: Rust target/ files are tracked by Git."
            exit 1
          fi

          echo "No Rust target/ files are tracked."

          rm -rf Android/Source/native/veilknit-daemon/target
          rm -rf Android/Source/app/build

      - name: Show disk space
        run: df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc-dev

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"

      - name: Pin Android NDK r28c
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Expected NDK not found at $NDK"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "Using NDK:"
          cat "$NDK/source.properties"

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

          rustup target add \
            --toolchain 1.97.1 \
            aarch64-linux-android \
            x86_64-linux-android

          cargo install cargo-ndk@4.1.2 --locked

          rustc --version
          cargo --version
          cargo ndk --version

      - name: Fetch Rust dependencies
        working-directory: Android/Source/native/veilknit-daemon
        run: cargo fetch --locked

      - name: Enable Gradle wrapper
        run: chmod +x Android/Source/gradlew


      - name: Build unsigned release APK
        working-directory: Android/Source
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          grep '^Pkg.Revision' "$ANDROID_NDK_HOME/source.properties"

          ./gradlew --no-daemon \
            -PweaveFdroidBuild=true \
            clean :app:assembleRelease \
            --stacktrace --info || {
              echo "=== DISK SPACE AFTER FAILURE ==="
              df -h
              echo "=== BUILD AND CACHE SIZES ==="
              du -sh native/veilknit-daemon/target app/build ~/.gradle ~/.cargo 2>/dev/null || true
              exit 1
            }


      - name: Collect APK
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          mkdir -p artifact

          # Replace characters unsuitable for filenames.
          SAFE_REF="$(printf '%s' "$RELEASE_REF" | sed 's#[^A-Za-z0-9._-]#-#g')"

          cp \
            Android/Source/app/build/outputs/apk/release/Weave-release.apk \
            "artifact/Weave-${SAFE_REF}-unsigned.apk"

          sha256sum artifact/*.apk | tee artifact/SHA256SUMS.txt

          ls -lh artifact/
          df -h


      - name: Sign release APK for direct installation
        shell: bash
        env:
          WEAVE_KEYSTORE_BASE64: ${{ secrets.WEAVE_KEYSTORE_BASE64 }}
          WEAVE_KEYSTORE_PASSWORD: ${{ secrets.WEAVE_KEYSTORE_PASSWORD }}
          WEAVE_KEY_ALIAS: ${{ secrets.WEAVE_KEY_ALIAS }}
          WEAVE_KEY_PASSWORD: ${{ secrets.WEAVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Check that all signing secrets exist.
          for VAR in \
            WEAVE_KEYSTORE_BASE64 \
            WEAVE_KEYSTORE_PASSWORD \
            WEAVE_KEY_ALIAS \
            WEAVE_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: Missing signing secret: $VAR"
              exit 1
            fi
          done

          BT="$ANDROID_HOME/build-tools/36.1.0"
          KEYSTORE="$RUNNER_TEMP/weave-release.jks"
          ALIGNED="$RUNNER_TEMP/weave-aligned.apk"

          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          # Restore release keystore from GitHub Secrets.
          printf '%s' "$WEAVE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          # Find the unsigned APK produced by Gradle.
          UNSIGNED="$(find artifact -maxdepth 1 \
            -name '*-unsigned.apk' -print -quit)"

          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: Unsigned APK not found"
            exit 1
          fi

          SIGNED="${UNSIGNED%-unsigned.apk}-signed.apk"

          # Align before signing.
          "$BT/zipalign" -P 16 -f 4 \
            "$UNSIGNED" "$ALIGNED"

          # Sign using the release keystore.
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$WEAVE_KEY_ALIAS" \
            --ks-pass env:WEAVE_KEYSTORE_PASSWORD \
            --key-pass env:WEAVE_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          # Verify the resulting signature.
          "$BT/apksigner" verify \
            --verbose --print-certs "$SIGNED"

          # Generate checksums for BOTH APKs.
          sha256sum artifact/*.apk \
            > artifact/SHA256SUMS.txt

          echo "Successfully generated:"
          ls -lh artifact/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weave-reproducible-build
          path: artifact/
          retention-days: 14
